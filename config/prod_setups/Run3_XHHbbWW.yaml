# Production setup: X->HH->bbWW resonant signal, Run3.
process: X_HH_bbWW
conditions: config/conditions_Run3.yaml

# output root (FLAF consumes <storage>/nanoAOD_<version>/<era>/<process>/<point>/nano_<version>_<n>.root)
storage: davs://eosuser.cern.ch:443/eos/user/k/kandroso/DSProd/XHHbbWW

eras: [Run3_2022EE]

# NanoAOD versions to produce per era (v12+v15 for 22-23BPix; v15-only for 2024)
nano_versions:
  Run3_2022: [v12, v15]
  Run3_2022EE: [v12, v15]
  Run3_2023: [v12, v15]
  Run3_2023BPix: [v12, v15]
  Run3_2024: [v15]

first_step: LHEGS
last_step: NANO

events_per_job: 2000
files_per_merge: 25 # NanoMergeTask groups (Phase 4)

points:
  # Channel note: the current fragment.py selects the SINGLE-lepton channel (2B2JLNu) via its
  # ResonanceDecayFilter daughters. The gridpack is channel-independent (shared across channels).
  # `gridpack:` set -> existing mode (import the central cvmfs gridpack). Remove it to generate
  # from the cards template (config/process_templates/X_HH_bbWW/cards) via genproductions_scripts.
  - name: GluGlutoRadiontoHHto2B2Vto2B2JLNu_M-800
    mass: 800
    spin: 0
    events_total: 100000
    gridpack: /cvmfs/cms.cern.ch/phys_generator/gridpacks/RunIII/13p6TeV/slc7_amd64_gcc10/MadGraph5_aMCatNLO/GF_HH_Spin0/Radion_hh_narrow_M800_slc7_amd64_gcc10_CMSSW_12_4_8_tarball.tar.xz
