# Per-era, per-step production conditions (gridpack -> NanoAOD).
#
# Sourced from the CMS McM public REST API (2026-08-12):
#   DR/MiniAOD/NANO conditions from the standard central TT/DY chains (canonical per campaign);
#   GS (LHE,GEN,SIM) conditions are campaign-standard (GT == DR GT, beamspot from the campaign).
# Values confirmed exact for Run3_2022EE (from the reachable chain requests). Fields flagged
# `# VERIFY` are inferred by pattern and should be checked against the era's own McM chain before
# the first real production in that era.
#
# Step resolution (see dsprod/run_step.py): merge  default  +  default_step[STEP]
#   +  <era>.default  +  <era>[STEP].  The final NANO step carries a `versions:` map, one entry
# per NanoAOD version to produce; each is resolved the same way on top of the NANO defaults.

default:
  comEnergy: 13600
  geometry: DB:Extended
  era: Run3
  OS_VERSION: el8 # all releases are run via the cmssw-el8 container on AlmaLinux9 workers
  customise:
    - Configuration/DataProcessing/Utils.addMonitoring

default_step:
  LHEGS:
    step: LHE,GEN,SIM
    eventcontent: RAWSIM,LHE
    datatier: GEN-SIM,LHE
  DIGIPremixHLT:
    eventcontent: PREMIXRAW
    datatier: GEN-SIM-RAW
    datamix: PreMix
    procModifiers: premix_stage2,siPixelQualityRawToDigi
  RECO:
    step: RAW2DIGI,L1Reco,RECO,RECOSIM
    eventcontent: AODSIM
    datatier: AODSIM
    procModifiers: siPixelQualityRawToDigi
  MINIAOD:
    step: PAT
    eventcontent: MINIAODSIM
    datatier: MINIAODSIM
  NANO:
    step: NANO
    eventcontent: NANOEDMAODSIM
    datatier: NANOAODSIM

