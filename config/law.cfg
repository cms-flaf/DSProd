[modules]
dsprod.tasks

[job]
job_file_dir: $ANALYSIS_PATH/data/jobs
job_file_dir_cleanup: False
# the CMSSW release law runs `crab` in, and with it the release of every CRAB task: the worker
# sets it up, and the grid branch of env.sh runs DSProd with its python3. Kept at the release
# DSProd's CRAB jobs have run with rather than law 0.1.21's default CMSSW_14_2_1, which would
# change every job's environment and install a second release under .law/cms/cmssw.
crab_sandbox_name: CMSSW_14_0_0::arch=el9_amd64_gcc12

[logging]
luigi-interface: INFO

[luigi_core]
local_scheduler: True
no_lock: True

[luigi_worker]
# NanoMergeTask consumes its inputs: it removes the staged per-seed nanos once the merged file is
# written and verified. luigi otherwise re-checks a task's dependencies immediately before running
# it, so the merge workflow fails on its own branches' cleanup ("Unfulfilled dependency at run
# time: RunProd..."). A genuinely missing input still fails, loudly, when the task tries to read it.
check_unfulfilled_deps: False
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0

# Remote storage (WLCG base) and CRAB site/resource settings are NOT here — they live in
# config/global.yaml, overridden per-user in config/user_custom.yaml (see dsprod/config.py).

[luigi_scheduler]
retry_count: 0
