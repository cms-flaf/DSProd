# DSProd global configuration: defaults for all runs, committed to the repository.
#
# User-specific settings are NOT here — they go into config/user_custom.yaml, which is
# git-ignored and merged on top of this file (scalars and lists override; nested maps are
# deep-merged). See dsprod/config.py and docs/configuration/settings.md.
#
# `fs_default` is the single file system all products are written to, whatever the workflow
# backend (local / htcondor / crab). A plain /... path selects a local file system instead.
# The default below is the shared production area at FNAL (the LPC group area FLAF also uses);
# override it in user_custom.yaml to write to your own space, e.g.
#   fs_default: davs://eoshome-k.cern.ch:8444/eos/user/k/kandroso/DSProd/
#
# NOTE: xrootd, not davs — davs writes to cmseos.fnal.gov fail from CERN (dCache pool-redirect
# DNS), while xrootd reads and writes both work. Same choice as FLAF's fs_anaCacheTuple.
fs_default: root://cmseos.fnal.gov//eos/uscms/store/group/lpcflaf/DSProd/

# CRAB backend: compute settings only. CRAB never stages out (DSProd owns all I/O), so there is
# no CRAB output location to configure.
#
# DSProd jobs have no real input dataset, so they may run at ANY CMS processing site. The CRAB
# client requires a whitelist whenever `ignoreLocality` is set, so an unset one defaults to every
# tier (T1_*, T2_*, T3_*) — the widest pool it accepts; setting one can only narrow it. CMS's
# global blacklist of known-broken sites stays in force.
# Optional keys:
#   whitelist: [ T2_CH_CERN, ... ]  restrict to these processing sites
#   blacklist: [ ... ]              exclude sites (e.g. ones that cannot reach your storage)
#   ignore_global_blacklist: true   waive CMS's known-broken-site list (not recommended)
#   parallel_jobs: 5000             jobs per CRAB task and in flight (--parallel-jobs wins)
#   refill_fraction: 0.2            min wave size / free slots, as a fraction of parallel_jobs
crab:
  max_memory_mb: 2500
  max_cores: 1
