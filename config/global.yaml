# DSProd global configuration: defaults for all runs, committed to the repository.
#
# User-specific settings are NOT here — they go into config/user_custom.yaml, which is
# git-ignored and merged on top of this file (scalars and lists override; nested maps are
# deep-merged). See dsprod/config.py and docs/configuration/settings.md.
#
# Required in user_custom.yaml:
#   fs_default: davs://eoshome-k.cern.ch:8444/eos/user/k/kandroso/DSProd/
# `fs_default` is the single file system all products are written to, whatever the workflow
# backend (local / htcondor / crab). A plain /... path selects a local file system instead.

# CRAB backend: compute settings only. CRAB never stages out (DSProd owns all I/O), so there is
# no CRAB output location to configure.
crab:
  whitelist: [ T2_CH_CERN ] # CMS processing site(s) for the jobs
  max_memory_mb: 2500
  max_cores: 1
