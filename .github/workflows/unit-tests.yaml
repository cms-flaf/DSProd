name: Unit tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install law, luigi and PyYAML
        run: pip install law luigi pyyaml
      - name: Run the unit tests
        run: python -m unittest discover -s test -v
