name: Unit tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the models submodule
        # The process plugins and the production setups live in DSProdModels, so a test that
        # instantiates a real task needs it. Only that one: `gridpacks` is a ~610 MB Git-LFS store
        # and both it and `genproductions_scripts` sit behind CERN GitLab SSH URLs, which a runner
        # cannot reach. DSProdModels is public, so rewriting its SSH URL to HTTPS needs no secret.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 models
      - uses: actions/setup-python@v5
        with:
          # the newest Python that luigi 3.7.3, pinned below, supports
          python-version: "3.12"
      - name: Install pip, luigi, law and PyYAML
        # pip, luigi and law at the releases env.sh pins in dsprod_pins (test_env_install_pins.py
        # checks that the two agree), installed as env.sh installs them; PyYAML, which env.sh does
        # not install, is left unpinned
        run: |
          python -m pip install pip==26.0.1
          pip install luigi==3.7.3 law==0.1.21 pyyaml
      - name: Install zsh
        # env.sh is sourced from bash and zsh, and test_env_install_pins.py runs it in both
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run the unit tests
        run: python -m unittest discover -s test -v
